<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>牛牛的健康减脂打卡记</title>
  
  <!-- 模块化 CSS 样式表 -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/calendar.css">
</head>
<body>

  <!-- 原生 Canvas 纸屑画布 -->
  <canvas id="confettiCanvas"></canvas>

  <div class="container">
    <!-- 历史记录回溯提示栏 -->
    <div class="history-banner" id="historyBanner">
      <span id="historyBannerText">📅 正在浏览历史打卡记录</span>
      <button class="return-today-btn" onclick="switchDate(getTodayKey())">返回今天</button>
    </div>

    <!-- 顶部状态栏 -->
    <div class="header-card">
      <button class="calendar-trigger-btn" onclick="openCalendar()">
        <span>📅</span>
        <span>打卡历</span>
      </button>

      <div class="avatar-wrapper" id="cowAvatar" title="戳一戳牛牛">
        <svg viewBox="0 0 100 100" width="100%" height="100%">
          <circle cx="24" cy="38" r="14" fill="#FDECE9" stroke="#4A4A4A" stroke-width="3"/>
          <circle cx="76" cy="38" r="14" fill="#FDECE9" stroke="#4A4A4A" stroke-width="3"/>
          <path d="M 28 32 Q 20 16 34 22" fill="#FED97D" stroke="#4A4A4A" stroke-width="3" stroke-linecap="round"/>
          <path d="M 72 32 Q 80 16 66 22" fill="#FED97D" stroke="#4A4A4A" stroke-width="3" stroke-linecap="round"/>
          <ellipse cx="50" cy="52" rx="36" ry="32" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="3"/>
          <ellipse cx="40" cy="48" rx="3.5" ry="5" fill="#4A4A4A"/>
          <ellipse cx="60" cy="48" rx="3.5" ry="5" fill="#4A4A4A"/>
          <circle cx="41.5" cy="46" r="1.5" fill="#FFFFFF"/>
          <circle cx="61.5" cy="46" r="1.5" fill="#FFFFFF"/>
          <circle cx="30" cy="56" r="5" fill="#FFAAA6" opacity="0.6"/>
          <circle cx="70" cy="56" r="5" fill="#FFAAA6" opacity="0.6"/>
          <ellipse cx="50" cy="66" rx="20" ry="13" fill="#FDECE9" stroke="#4A4A4A" stroke-width="3"/>
          <circle cx="44" cy="65" r="2.5" fill="#4A4A4A"/>
          <circle cx="56" cy="65" r="2.5" fill="#4A4A4A"/>
        </svg>
      </div>
      <div class="greeting-text">
        <h2 id="greetingMsg">早安，牛牛！</h2>
        <p id="subGreeting">今天也是认真爱自己的一天</p>
        <div class="tags-row">
          <span class="streak-badge" id="streakBadge">已累计打卡 1 天</span>
          <span class="cloud-sync-tag" id="cloudSyncTag">☁️ 已连云端</span>
        </div>
      </div>
    </div>

    <!-- 喝水追踪 -->
    <div class="water-card">
      <div class="card-title-row">
        <span class="card-title">💧 今日喝水打卡</span>
        <span style="font-size: 0.8rem; color: var(--text-muted);" id="waterCount">0 / 8 杯 (0ml)</span>
      </div>
      <div class="water-cups" id="waterCupsContainer"></div>
    </div>

    <!-- 午餐卡片 -->
    <div class="meal-card" id="card-lunch">
      <div class="meal-header">
        <div class="meal-title">🍱 午餐</div>
        <div class="meal-header-right">
          <div class="meal-time-tag" id="time-lunch"></div>
          <button class="undo-btn" id="undo-lunch" onclick="undoCard('lunch')">修改</button>
        </div>
      </div>
      <input type="text" class="meal-input" id="input-lunch" placeholder="例如：香煎鸡胸肉 + 西蓝花 + 紫薯">
      <div class="satiety-selector" data-item="lunch">
        <button class="satiety-btn active" data-val="刚好">😋 刚刚好</button>
        <button class="satiety-btn" data-val="清爽">🥗 七分饱</button>
        <button class="satiety-btn" data-val="偏饱">🍲 很满足</button>
      </div>
      <button class="punch-btn" onclick="punchCard('lunch')">完成午餐打卡</button>
    </div>

    <!-- 晚餐卡片 -->
    <div class="meal-card" id="card-dinner">
      <div class="meal-header">
        <div class="meal-title">🍲 晚餐</div>
        <div class="meal-header-right">
          <div class="meal-time-tag" id="time-dinner"></div>
          <button class="undo-btn" id="undo-dinner" onclick="undoCard('dinner')">修改</button>
        </div>
      </div>
      <input type="text" class="meal-input" id="input-dinner" placeholder="例如：大虾蔬菜沙拉 + 无糖豆浆">
      <div class="satiety-selector" data-item="dinner">
        <button class="satiety-btn active" data-val="刚好">😋 刚刚好</button>
        <button class="satiety-btn" data-val="清爽">🥗 七分饱</button>
        <button class="satiety-btn" data-val="偏饱">🍲 很满足</button>
      </div>
      <button class="punch-btn" onclick="punchCard('dinner')">完成晚餐打卡</button>
    </div>

    <!-- 健身卡片 -->
    <div class="meal-card" id="card-fitness">
      <div class="meal-header">
        <div class="meal-title">🏃‍♀️ 健身</div>
        <div class="meal-header-right">
          <div class="meal-time-tag" id="time-fitness"></div>
          <button class="undo-btn" id="undo-fitness" onclick="undoCard('fitness')">修改</button>
        </div>
      </div>
      <input type="text" class="meal-input" id="input-fitness" placeholder="例如：帕梅拉全身燃脂 / 慢跑 3km / 普拉提拉伸">
      <div class="satiety-selector duration-grid" data-item="fitness">
        <button class="satiety-btn" data-val="30分钟以内">
          <span class="duration-time">🌱 30分钟以内</span>
          <span class="duration-desc">(轻量激活)</span>
        </button>
        <button class="satiety-btn active" data-val="30~60分钟">
          <span class="duration-time">🔥 30~60分钟</span>
          <span class="duration-desc">(常规燃脂)</span>
        </button>
        <button class="satiety-btn" data-val="60~90分钟">
          <span class="duration-time">💪 60~90分钟</span>
          <span class="duration-desc">(深度暴汗)</span>
        </button>
        <button class="satiety-btn" data-val="90分钟以上">
          <span class="duration-time">👑 90分钟以上</span>
          <span class="duration-desc">(自律战神)</span>
        </button>
      </div>
      <button class="punch-btn" onclick="punchCard('fitness')">完成健身打卡</button>
    </div>
  </div>

  <!-- 全页展开日历组件 -->
  <div class="calendar-page-overlay" id="calendarOverlay">
    <div class="calendar-wrapper">
      <div class="cal-header-bar">
        <button class="cal-close-btn" onclick="closeCalendar()">← 返回打卡</button>
        <div class="cal-title">牛牛的打卡足迹</div>
        <div style="width: 70px;"></div>
      </div>

      <div class="cal-card">
        <div class="cal-nav-row">
          <button class="cal-nav-btn" onclick="changeCalMonth(-1)">‹</button>
          <div class="cal-current-month" id="calMonthTitle">2026年 9月</div>
          <button class="cal-nav-btn" onclick="changeCalMonth(1)">›</button>
        </div>

        <div class="cal-weekdays">
          <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
        </div>

        <div class="cal-grid" id="calGrid"></div>

        <div class="cal-legend">
          <div class="legend-item">
            <span class="legend-dot" style="background: var(--primary-green-light); border: 1px solid #CDE2CF;"></span>
            <span>1项 🌱</span>
          </div>
          <div class="legend-item">
            <span class="legend-dot" style="background: var(--primary-green-mid);"></span>
            <span>2项 🌸</span>
          </div>
          <div class="legend-item">
            <span class="legend-dot" style="background: var(--primary-green);"></span>
            <span>3项满卡 👑</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 鼓励与提醒弹窗 -->
  <div class="modal-overlay" id="cheerModal">
    <div class="modal-content">
      <div class="modal-icon" id="modalIcon">🎉</div>
      <div class="modal-msg" id="modalQuote">打卡成功！</div>
      <button class="modal-close-btn" onclick="closeModal()">知道啦 (收下鼓励)</button>
    </div>
  </div>

  <!-- 模块化 JavaScript 脚本引入 (按依赖顺序加载) -->
  <script src="js/config.js"></script>
  <script src="js/confetti.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
