<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>牛牛的健康减脂打卡记</title>
  
  <!-- 模块化 CSS 样式表 -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/calendar.css">
</head>
<body>

  <!-- 原生 Canvas 纸屑画布 -->
  <canvas id="confettiCanvas"></canvas>

  <div class="container">
    <!-- 顶部状态栏 -->
    <div class="header-card">
      <div class="avatar-wrapper" id="cowAvatar" title="戳一戳牛牛">
        <svg viewBox="0 0 100 100" width="100%" height="100%">
          <circle cx="24" cy="38" r="14" fill="#FDECE9" stroke="#4A4A4A" stroke-width="3"/>
          <circle cx="76" cy="38" r="14" fill="#FDECE9" stroke="#4A4A4A" stroke-width="3"/>
          <path d="M 28 32 Q 20 16 34 22" fill="#FED97D" stroke="#4A4A4A" stroke-width="3" stroke-linecap="round"/>
          <path d="M 72 32 Q 80 16 66 22" fill="#FED97D" stroke="#4A4A4A" stroke-width="3" stroke-linecap="round"/>
          <ellipse cx="50" cy="52" rx="36" ry="32" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="3"/>
          <ellipse cx="40" cy="48" rx="3.5" ry="5" fill="#4A4A4A"/>
          <ellipse cx="60" cy="48" rx="3.5" ry="5" fill="#4A4A4A"/>
          <circle cx="41.5" cy="46" r="1.5" fill="#FFFFFF"/>
          <circle cx="61.5" cy="46" r="1.5" fill="#FFFFFF"/>
          <circle cx="30" cy="56" r="5" fill="#FFAAA6" opacity="0.6"/>
          <circle cx="70" cy="56" r="5" fill="#FFAAA6" opacity="0.6"/>
          <ellipse cx="50" cy="66" rx="20" ry="13" fill="#FDECE9" stroke="#4A4A4A" stroke-width="3"/>
          <circle cx="44" cy="65" r="2.5" fill="#4A4A4A"/>
          <circle cx="56" cy="65" r="2.5" fill="#4A4A4A"/>
        </svg>
      </div>
      <div class="greeting-text">
        <h2 id="greetingMsg">早安，牛牛！</h2>
        <p id="subGreeting">今天也是认真爱自己的一天</p>
        <div class="tags-row">
          <span class="streak-badge" id="streakBadge">已累计打卡 1 天</span>
          <span class="cloud-sync-tag" id="cloudSyncTag">☁️ 已连云端</span>
        </div>
      </div>
    </div>

    <!-- 相邻日期快速切换 -->
    <nav class="date-navigator" aria-label="打卡日期切换">
      <button class="date-nav-arrow" id="previousDateBtn" type="button" onclick="navigateDate(-1)" aria-label="查看前一天">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 6L9 12L15 18"></path>
        </svg>
      </button>
      <div class="date-nav-center">
        <button class="date-nav-date" type="button" onclick="openCalendar()" aria-label="打开日历选择日期">
          <span id="dateNavTitle">今天</span>
          <span class="date-nav-hint" id="dateNavHint">轻触打开日历</span>
        </button>
        <button class="date-return-today" id="dateReturnToday" type="button" onclick="switchDate(getTodayKey())" hidden>
          <span>历史记录</span><span class="date-nav-dot">·</span><span class="date-return-text">回到今天</span>
        </button>
      </div>
      <button class="date-nav-arrow" id="nextDateBtn" type="button" onclick="navigateDate(1)" aria-label="查看后一天">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 6L15 12L9 18"></path>
        </svg>
      </button>
    </nav>

    <!-- 喝水追踪 -->
    <div class="water-card">
      <div class="card-title-row">
        <span class="card-title">💧 喝水</span>
        <div class="water-summary">
          <span class="water-total" id="waterCount">0 ml</span>
          <button class="water-correct-btn" id="waterCorrectBtn" type="button" onclick="openWaterCorrection()">修改</button>
        </div>
      </div>
      <div class="water-tracker">
        <div class="jug-stage">
          <div class="water-jug" id="waterJug" role="img" aria-label="今日饮水量 0 毫升">
            <div class="jug-handle"></div>
            <div class="jug-body">
              <div class="water-fill" id="waterFill">
                <div class="water-surface"></div>
                <span class="water-bubble bubble-one"></span>
                <span class="water-bubble bubble-two"></span>
                <span class="water-bubble bubble-three"></span>
              </div>
              <div class="jug-marker halfway-marker"><span>750 ml · 过半</span></div>
              <div class="jug-marker target-marker"><span>1500 ml · 目标</span></div>
            </div>
          </div>
          <div class="jug-caption">成年女性日常饮水参考</div>
        </div>
        <div class="water-controls">
          <label for="waterInput">这次喝了多少水？</label>
          <div class="number-input-wrap">
            <input type="number" id="waterInput" min="1" max="3000" step="1" inputmode="numeric" placeholder="例如 300">
            <span>ml</span>
          </div>
          <button class="water-save-btn" id="waterSaveBtn" type="button" onclick="addWaterAmount()">＋ 计入今日饮水</button>
          <p class="water-message" id="waterMessage">水壶还空空的，等牛牛来装满它～</p>
          <button class="water-undo-btn" id="waterUndoBtn" type="button" onclick="undoLastWaterChange()">撤销刚才记录</button>
        </div>
      </div>
    </div>

    <!-- 午餐卡片 -->
    <div class="meal-card" id="card-lunch">
      <div class="meal-header">
        <div class="meal-title">🍱 午餐</div>
        <div class="meal-header-right">
          <div class="meal-time-tag" id="time-lunch"></div>
          <button class="undo-btn" id="undo-lunch" onclick="undoCard('lunch')">修改</button>
        </div>
      </div>
      <input type="text" class="meal-input" id="input-lunch" placeholder="例如：香煎鸡胸肉 + 西蓝花 + 紫薯">
      <div class="satiety-selector" data-item="lunch">
        <button class="satiety-btn active" data-val="刚好">😋 刚刚好</button>
        <button class="satiety-btn" data-val="清爽">🥗 七分饱</button>
        <button class="satiety-btn" data-val="偏饱">🍲 很满足</button>
      </div>
      <button class="punch-btn" onclick="punchCard('lunch')">完成午餐打卡</button>
    </div>

    <!-- 晚餐卡片 -->
    <div class="meal-card" id="card-dinner">
      <div class="meal-header">
        <div class="meal-title">🍲 晚餐</div>
        <div class="meal-header-right">
          <div class="meal-time-tag" id="time-dinner"></div>
          <button class="undo-btn" id="undo-dinner" onclick="undoCard('dinner')">修改</button>
        </div>
      </div>
      <input type="text" class="meal-input" id="input-dinner" placeholder="例如：大虾蔬菜沙拉 + 无糖豆浆">
      <div class="satiety-selector" data-item="dinner">
        <button class="satiety-btn active" data-val="刚好">😋 刚刚好</button>
        <button class="satiety-btn" data-val="清爽">🥗 七分饱</button>
        <button class="satiety-btn" data-val="偏饱">🍲 很满足</button>
      </div>
      <button class="punch-btn" onclick="punchCard('dinner')">完成晚餐打卡</button>
    </div>

    <!-- 健身卡片 -->
    <div class="meal-card" id="card-fitness">
      <div class="meal-header">
        <div class="meal-title">🏃‍♀️ 健身</div>
        <div class="meal-header-right">
          <div class="meal-time-tag" id="time-fitness"></div>
          <button class="undo-btn" id="undo-fitness" onclick="undoCard('fitness')">修改</button>
        </div>
      </div>
      <input type="text" class="meal-input" id="input-fitness" placeholder="例如：跑步机 / 动感单车 / 力量训练">
      <div class="fitness-duration-block">
        <label for="fitnessDurationInput">今天运动了多久？</label>
        <div class="number-input-wrap fitness-number-input">
          <input type="number" id="fitnessDurationInput" min="1" max="600" step="1" inputmode="numeric" aria-label="运动时长（分钟）">
          <span class="fitness-duration-unit">分钟</span>
          <span class="fitness-duration-example">示例 45 分钟</span>
          <span class="fitness-legacy-value" id="fitnessLegacyDuration"></span>
        </div>
      </div>
      <button class="punch-btn" onclick="punchCard('fitness')">完成健身打卡</button>
    </div>
  </div>

  <!-- 全页展开日历组件 -->
  <div class="calendar-page-overlay" id="calendarOverlay">
    <div class="calendar-wrapper">
      <div class="cal-header-bar">
        <button class="cal-close-btn" onclick="closeCalendar()">← 返回打卡</button>
        <div class="cal-title">牛牛的打卡足迹</div>
        <div style="width: 70px;"></div>
      </div>

      <div class="cal-card">
        <div class="cal-nav-row">
          <button class="cal-nav-btn" onclick="changeCalMonth(-1)">‹</button>
          <div class="cal-current-month" id="calMonthTitle">2026年 9月</div>
          <button class="cal-nav-btn" onclick="changeCalMonth(1)">›</button>
        </div>

        <div class="cal-weekdays">
          <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
        </div>

        <div class="cal-grid" id="calGrid"></div>

        <div class="cal-legend">
          <div class="legend-item">
            <span class="legend-dot" style="background: var(--primary-green-light); border: 1px solid #CDE2CF;"></span>
            <span>1项 🌱</span>
          </div>
          <div class="legend-item">
            <span class="legend-dot" style="background: var(--primary-green-mid);"></span>
            <span>2项 🌸</span>
          </div>
          <div class="legend-item">
            <span class="legend-dot" style="background: var(--primary-green);"></span>
            <span>3项满卡 👑</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 鼓励与提醒弹窗 -->
  <div class="modal-overlay" id="cheerModal">
    <div class="modal-content">
      <div class="modal-icon" id="modalIcon">🎉</div>
      <div class="modal-msg" id="modalQuote">打卡成功！</div>
      <button class="modal-close-btn" onclick="closeModal()">知道啦 (收下鼓励)</button>
    </div>
  </div>

  <!-- 今日饮水总量修正弹窗 -->
  <div class="modal-overlay" id="waterCorrectionModal">
    <div class="modal-content water-correction-content">
      <div class="modal-icon">💧</div>
      <div class="water-correction-title">修正今日累计饮水量</div>
      <div class="number-input-wrap water-correction-input">
        <input type="number" id="waterCorrectionInput" min="0" max="10000" step="1" inputmode="numeric">
        <span>ml</span>
      </div>
      <div class="water-correction-actions">
        <button type="button" class="correction-cancel-btn" onclick="closeWaterCorrection()">取消</button>
        <button type="button" class="correction-confirm-btn" onclick="confirmWaterCorrection()">确认修正</button>
      </div>
    </div>
  </div>

  <!-- 本地测试开关：线上环境始终保持正式模式 -->
  <script>
    window.NIUNIU_TEST_MODE = false;
    if (location.protocol === 'file:' || ['localhost', '127.0.0.1', '::1'].includes(location.hostname)) {
      document.write('<script src="test_mode.js"><\/script>');
    }
  </script>

  <!-- 模块化 JavaScript 脚本引入 (按依赖顺序加载) -->
  <script src="js/config.js"></script>
  <script src="js/confetti.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
